# Project-specific HTTP listener. No certificates, TLS, HSTS or HTTPS redirect.
server {
    listen 0.0.0.0:18707;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 45s;
    send_timeout 60s;
    access_log off;
    error_log /var/log/nginx/table-purifier-error.log warn;

    location = / { return 302 /preview/; }
    location /health/ {
        proxy_pass http://127.0.0.1:18708;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /v1/p07/ {
        proxy_pass http://127.0.0.1:18708;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /preview/ {
        alias /opt/table-purifier/site/preview/;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Frame-Options DENY always;
        limit_except GET { deny all; }
    }
    location /assets/icons/ {
        alias /opt/table-purifier/site/preview/assets/icons/;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location / { return 404; }
}
